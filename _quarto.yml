blog:
    order: date desc  # Newest first (or `order: date asc` for oldest first)

bibliography: R.bib  # top level, so that it applies to both HTML and PDF

format:
  html:
    page-layout: full  
    theme: cosmo
    css: styles.css
    toc: true
    reference-location: margin
    number-sections: false
    code-overflow: wrap
  pdf:
    # Draw R plots with the cairo_pdf device, which (unlike the default pdf device)
    # renders Unicode characters such as Greek letters (μ, σ, λ) correctly
    knitr:
      opts_chunk:
        dev: quartz_pdf
    # Monospace font for code: the default (Latin Modern Mono) has no Greek letters,
    # so 'λ' in code chunks disappears from the PDF. Uncomment ONE font that is
    # installed on your computer:
    # monofont: "Menlo"              # macOS
    # monofont: "Consolas"           # Windows
    # monofont: "DejaVu Sans Mono"   # Linux
    # Only used for handouts that add 'pdf: default' to their own format block,
    # or when rendering a single file with 'quarto render <file> --to pdf'.
    date: last-modified           # when the .qmd file was last saved
    date-format: "D MMMM YYYY, HH:mm"
    documentclass: scrartcl
    papersize: a4
    classoption: [DIV=11]
    template-partials:
      - title.tex                 # adds affiliations and ORCID to the title block
    link-citations: true          # in-text citations link to the bibliography entry
    hyperrefoptions:
      - linktoc=all               # TOC: both the titles and the page numbers are clickable
      - pdfpagemode=UseOutlines   # open the PDF with the bookmarks panel visible
      - bookmarksopen=true        # show the bookmarks expanded
      - bookmarksopenlevel=1
    reference-location: document  # footnotes at the bottom of the page instead of the margin
    number-sections: false
    include-in-header:
      text: |
        \usepackage{fvextra}
        \DefineVerbatimEnvironment{Highlighting}{Verbatim}{breaklines,commandchars=\\\{\}}
        % Running header: site name on the left, unit title on the right (not on the title page)
        \usepackage[headsepline]{scrlayer-scrpage}
        \pagestyle{scrheadings}
        \clearpairofpagestyles
        \makeatletter
        \ihead{\small Statistics for Corpus Linguists}
        \ohead{\small\@title}
        \makeatother
        \cfoot*{\pagemark}
        % 'References' heading on the same level as the '##' headings (TOC + bookmarks)
        \AddToHook{env/CSLReferences/before}{%
          \subsection*{References}\phantomsection\addcontentsline{toc}{subsection}{References}}
    include-before-body:
      text: |
        % Number exercises, definitions etc. continuously (1, 2, 3, ...) instead of
        % by section (0.1, 0.2, ...), since sections are unnumbered
        \makeatletter
        \@ifundefined{c@exercise}{}{\counterwithout{exercise}{section}}
        \@ifundefined{c@definition}{}{\counterwithout{definition}{section}}
        \@ifundefined{c@theorem}{}{\counterwithout{theorem}{section}}
        \@ifundefined{c@lemma}{}{\counterwithout{lemma}{section}}
        \@ifundefined{c@corollary}{}{\counterwithout{corollary}{section}}
        \@ifundefined{c@proposition}{}{\counterwithout{proposition}{section}}
        \@ifundefined{c@conjecture}{}{\counterwithout{conjecture}{section}}
        \@ifundefined{c@example}{}{\counterwithout{example}{section}}
        \@ifundefined{c@refremark}{}{\counterwithout{refremark}{section}}
        \@ifundefined{c@refsolution}{}{\counterwithout{refsolution}{section}}
        \makeatother